modLoader="javafml"
issueTrackerURL="${mod_issue_url}"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_url}"
logoFile="${mod_logo}"
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties."${mod_id}"]
catalogueImageIcon="${mod_logo}"

[[mixins]]
config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="catalogue"
type="optional"
versionRange="[]"
ordering="NONE"
side="BOTH"
